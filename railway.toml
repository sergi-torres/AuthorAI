# Railway service config for the AutorIA FastAPI backend (monorepo).
#
# IMPORTANT: leave Root Directory EMPTY (repo root), NOT `backend/`.
# Passport verify imports `autoria_ai` from `ai_pipeline/`, which is a sibling
# of `backend/` — with Root Directory = backend that package is not in the image
# and uvicorn crashes with ModuleNotFoundError: No module named 'autoria_ai'.
#
# Secrets (WATSONX_API_KEY, SUPABASE_URL, SUPABASE_KEY, DATABASE_URL,
# AUTORIA_CORS_ORIGINS, PASSPORT_*) are set under Service → Variables.
#
# buildCommand installs `requirements-deploy.txt`, NOT `backend/requirements.txt`:
# one process imports both `backend/app` and `ai_pipeline/autoria_ai`, so the
# image needs the union of both pyprojects. See that file's header (WO-02 / #83).
# The builder's own install phase already runs `pip install -r requirements.txt`
# (the root shim); buildCommand runs after it and layers the pipeline deps on top.
#
# The second half of buildCommand fetches the spaCy model `en_core_web_lg`.
# It is NOT a PyPI package (`pip install en_core_web_lg` 404s), so it cannot be
# a line in requirements-deploy.txt; `python -m spacy download` resolves the
# model release matching the spaCy version pip just installed. Without it
# `autoria_ai.generator._ensure_models()` raises OSError [E050] and every
# POST /api/generate returns 500 — while /health still reports 200, because
# backend/app/main.py swallows the warmup failure.

[build]
builder = "NIXPACKS"
buildCommand = "pip install -r requirements-deploy.txt && python -m spacy download en_core_web_lg"

[deploy]
startCommand = "cd backend && PYTHONPATH=../ai_pipeline uvicorn app.main:app --host 0.0.0.0 --port $PORT"
healthcheckPath = "/health"
# 300s, not the default 100s: ai_pipeline/autoria_ai/embedder.py:23 constructs
# SentenceTransformer("all-mpnet-base-v2") at MODULE import, so the first boot
# downloads ~418 MB from HuggingFace inside the FastAPI lifespan — before the
# app can answer the first /health probe. At 100s that download does not finish,
# the healthcheck fails and Railway kills the deploy.
healthcheckTimeout = 300
restartPolicyType = "ON_FAILURE"
restartPolicyMaxRetries = 3
